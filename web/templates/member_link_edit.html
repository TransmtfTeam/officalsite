{{template "base" .}}

{{define "content"}}
<div class="panel-wrap">
  <aside class="sidebar">
    <div class="sidebar-section">
      <div class="sidebar-title">成员导航</div>
      <a class="sidebar-link" href="/member/projects">项目管理</a>
      <a class="sidebar-link active" href="/member/links">友情链接</a>
      <a class="sidebar-link" href="/member/users">用户管理</a>
      {{if .CurrentUser}}{{if .CurrentUser.IsAdmin}}<a class="sidebar-link" href="/admin">管理后台</a>{{end}}{{end}}
    </div>
    <div class="sidebar-section">
      <div class="sidebar-title">快速入口</div>
      <a class="sidebar-link" href="/">返回首页</a>
      <a class="sidebar-link" href="/profile">个人资料</a>
    </div>
  </aside>

  <main class="panel-content">
    <div style="margin-bottom:.5rem">
      <a href="/member/links" style="color:var(--text2);font-size:.9rem">← 友情链接</a>
    </div>

    {{if .Flash}}
    <div class="flash {{if .IsError}}flash-err{{else}}flash-ok{{end}}">{{.Flash}}</div>
    {{end}}

    <h1 class="panel-title">编辑友情链接</h1>

    {{with .Data}}
    <div class="form-panel">
      <form method="POST" action="/member/links/{{.ID}}/edit">
        <input type="hidden" name="csrf_token" value="{{$.CSRFToken}}">
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">名称</label>
            <input class="form-control" type="text" name="name" value="{{.Name}}" required>
          </div>
          <div class="form-group">
            <label class="form-label">链接地址</label>
            <input class="form-control" type="url" name="url" value="{{.URL}}" required>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">排序值（小值靠前）</label>
            <input class="form-control" type="number" name="sort_order" value="{{.SortOrder}}">
          </div>
        </div>
        <input type="hidden" name="icon" value="{{.Icon}}">
        <div style="display:flex;gap:.8rem">
          <button class="btn btn-primary" type="submit">保存</button>
          <a class="btn btn-ghost" href="/member/links">取消</a>
        </div>
      </form>
    </div>

    <div class="form-panel" style="margin-top:1rem">
      <p class="form-panel-title">图标</p>
      <div style="display:flex;gap:1rem;align-items:flex-start;flex-wrap:wrap;margin-bottom:.8rem">
        <div style="width:64px;height:64px;border-radius:8px;overflow:hidden;background:#f3f4f6;display:flex;align-items:center;justify-content:center;flex-shrink:0">
          {{if .Icon}}
          <img src="{{.Icon}}" alt="图标" style="width:100%;height:100%;object-fit:cover">
          {{else}}
          <span style="color:#9ca3af;font-size:1.2rem">🔗</span>
          {{end}}
        </div>
        <form method="POST" action="/member/links/{{.ID}}/upload-icon" enctype="multipart/form-data" style="flex:1;min-width:240px">
          <input type="hidden" name="csrf_token" value="{{$.CSRFToken}}">
          <input class="form-control" type="file" name="icon_file" accept="image/*" required>
          <p style="font-size:.78rem;color:var(--text2);margin:.4rem 0">支持任意图片格式，单文件不超过 5MB。</p>
          <button class="btn btn-ghost btn-sm" type="submit">上传图标</button>
        </form>
      </div>
    </div>
    {{end}}
  </main>
</div>
{{end}}
