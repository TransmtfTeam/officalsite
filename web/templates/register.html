{{template "base" .}}

{{define "content"}}
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="auth-logo-text">{{.SiteName}}</div>
    </div>
    <h2 class="auth-title">创建账号</h2>

    {{with .Data}}
    {{if .OIDCChallenge}}
    <div class="flash flash-ok" style="margin-bottom:1rem">
      你正在使用 <strong>{{.OIDCProviderName}}</strong> 首次登录，请完善注册信息后完成绑定。
    </div>
    {{end}}
    {{end}}

    <form method="POST" action="/register">
      <input type="hidden" name="csrf_token" value="{{$.CSRFToken}}">
      {{with .Data}}
      {{if .Next}}<input type="hidden" name="next" value="{{.Next}}">{{end}}
      {{if .OIDCChallenge}}<input type="hidden" name="oidc_challenge" value="{{.OIDCChallenge}}">{{end}}
      {{end}}
      <div class="form-group">
        <label class="form-label">邮箱</label>
        <input class="form-control" type="email" name="email" placeholder="请输入邮箱地址" value="{{with .Data}}{{.PrefillEmail}}{{end}}" required autofocus>
      </div>
      <div class="form-group">
        <label class="form-label">显示名称</label>
        <input class="form-control" type="text" name="display_name" placeholder="你的昵称" value="{{with .Data}}{{.PrefillDisplayName}}{{end}}" required>
      </div>
      <div class="form-group">
        <label class="form-label">密码（至少 8 位）</label>
        <input class="form-control" type="password" name="password" placeholder="请输入密码" required minlength="8">
      </div>
      <div class="form-group">
        <label class="form-label">确认密码</label>
        <input class="form-control" type="password" name="confirm" placeholder="再次输入密码" required>
      </div>

      <div class="ti-consent">
        <input type="checkbox" id="agree-tos" name="agree_tos" value="1" required>
        <label for="agree-tos">
          我已阅读并同意
          <a href="/tos?raw=1" data-legal-doc="服务条款">《服务条款》</a>
          与
          <a href="/privacy?raw=1" data-legal-doc="隐私政策">《隐私政策》</a>
        </label>
      </div>

      <button class="btn btn-primary" style="width:100%;justify-content:center;margin-top:.5rem" type="submit">注册</button>
    </form>

    <p class="auth-footer-link">已有账号？<a href="/login{{with .Data}}{{if .OIDCChallenge}}?oidc_challenge={{.OIDCChallenge | urlEncode}}{{else if .Next}}?next={{.Next | urlEncode}}{{end}}{{end}}">去登录</a></p>
  </div>
</div>

<script>
(function(){
  // Open ToS / Privacy in an inline animated modal — robust to any document
  // structure: we fetch the raw HTML fragment and place it inside our modal
  // container. The modal itself is created by base.html's openDocModal which
  // appends to <body> with z-index:99998 + position:fixed + flex centering.
  function wire(){
    document.querySelectorAll('[data-legal-doc]').forEach(function(a){
      a.addEventListener('click',function(e){
        e.preventDefault();
        var url=a.getAttribute('href');
        var title=a.getAttribute('data-legal-doc')||'文档';
        // Show an immediate placeholder modal so the user sees an instant
        // response, then load the content into it.
        var ov=window.openDocModal(title,'<p style="color:#888">加载中…</p>');
        var body=ov.querySelector('.ti-modal-b');
        fetch(url,{credentials:'same-origin',headers:{'Accept':'text/html'}})
          .then(function(r){return r.text();})
          .then(function(html){
            // Strip <!doctype>/<html>/<head>/<body> wrappers if the server
            // happened to return a full document. We render the result inside
            // a sandboxed wrapper so its CSS cannot affect the host page.
            var doc=new DOMParser().parseFromString(html,'text/html');
            var inner=doc.body? doc.body.innerHTML : html;
            body.innerHTML=inner;
          })
          .catch(function(){
            body.innerHTML='<p style="color:#dc2626">加载失败，请稍后再试，或直接 <a href="'+url.replace('?raw=1','')+'" target="_blank" rel="noopener">在新页面打开</a>。</p>';
          });
      });
    });
  }
  if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',wire);}
  else{wire();}
})();
</script>
{{end}}
